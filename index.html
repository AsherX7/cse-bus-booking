<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSE (AI), S3 — Coach Booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg: #08080a;
    --bg-2: #0f0f13;
    --panel-bg: #131316;
    --panel-border: #262629;
    --hairline: #2a2a2e;
    --gold: #c9a463;
    --gold-bright: #e3c383;
    --gold-dim: #8a7449;
    --text: #f2efe8;
    --muted: #8f8d87;
    --muted-2: #5c5b58;
    --booked: #c9a463;
    --booked-text: #14120c;
    --faculty-bg: #1c1811;
    --faculty-border: #4a3f2a;
    --release: #a85c46;
    --focus: #e3c383;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{
    font-family:'Manrope', sans-serif;
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 50% -10%, #17151066 0%, transparent 60%),
      var(--bg);
  }
  ::selection{ background: var(--gold); color:#14120c; }
  a, button{ font-family:inherit; }
  button{ cursor:pointer; }
  button:focus-visible, [tabindex]:focus-visible, input:focus-visible{
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 20px;
    background: rgba(8,8,10,0.86);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--hairline);
  }
  .tab-btn{
    background:none; border:1px solid var(--panel-border); color:var(--text);
    padding:8px 16px; border-radius:999px; font-size:13.5px; font-weight:600;
    letter-spacing:.2px; display:flex; align-items:center; gap:7px;
    transition: border-color .15s ease, background .15s ease;
  }
  .tab-btn:hover{ border-color: var(--gold-dim); background: #17150f; }
  .tab-btn .dot{ width:6px; height:6px; border-radius:50%; background:var(--gold); display:inline-block; }
  .course-tag{
    font-family:'Fraunces', serif; font-weight:500; font-size:17px;
    color: var(--gold-bright); letter-spacing:.3px;
  }

  /* ---------- Layout shell ---------- */
  .wrap{ max-width: 780px; margin: 0 auto; padding: 0 20px 90px; }
  .hero{ padding: 34px 0 6px; }
  .hero h1{
    font-family:'Fraunces', serif; font-weight:500; font-size: clamp(26px,5vw,34px);
    margin:0 0 6px; color:var(--text);
  }
  .hero p{ margin:0; color:var(--muted); font-size:14.5px; max-width:52ch; line-height:1.5; }

  /* ---------- Segmented controls ---------- */
  .seg-group{ margin-top:22px; }
  .seg-label{ font-size:11.5px; color:var(--muted-2); margin:0 0 8px 2px; font-weight:700; letter-spacing:.4px; }
  .seg{
    display:flex; gap:8px; flex-wrap:wrap;
  }
  .seg button{
    background:var(--panel-bg); border:1px solid var(--panel-border); color:var(--muted);
    padding:10px 15px; border-radius:10px; font-size:13.5px; font-weight:600;
    transition: all .15s ease;
  }
  .seg button:hover{ color:var(--text); border-color:var(--gold-dim); }
  .seg button.active{
    color:#14120c; background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    border-color: var(--gold);
  }

  /* ---------- Coach ---------- */
  .coach-shell{
    margin-top:28px; background: var(--panel-bg); border:1px solid var(--panel-border);
    border-radius:22px; padding: 26px 18px 22px;
    position:relative;
  }
  .coach-shell::before{
    content:""; position:absolute; inset:0; border-radius:22px; padding:1px;
    background: linear-gradient(160deg, #3a331f, transparent 40%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events:none;
  }
  .coach-head{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;
    padding: 0 4px;
  }
  .coach-head .name{ font-size:13px; color:var(--muted); font-weight:600; }
  .coach-head .count{ font-size:12.5px; color:var(--gold-bright); font-weight:700; }

  .cabin{
    background: linear-gradient(180deg, #0d0d10, #0a0a0c);
    border: 1px solid var(--hairline);
    border-radius: 16px 16px 30px 30px;
    padding: 18px 14px 20px;
  }

  .front-strip{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px; padding: 0 2px 14px; border-bottom: 1px dashed var(--hairline);
  }
  .driver-badge{
    display:flex; align-items:center; gap:8px; color:var(--muted-2); font-size:11.5px; font-weight:700;
  }
  .steer{
    width:22px; height:22px; border-radius:50%; border:2.5px solid var(--muted-2); position:relative;
  }
  .steer::before{ content:""; position:absolute; top:50%; left:-3px; right:-3px; height:2.5px; background:var(--muted-2); transform:translateY(-50%); }
  .steer::after{ content:""; position:absolute; left:50%; top:-3px; bottom:-3px; width:2.5px; background:var(--muted-2); transform:translateX(-50%); }
  .door-badge{
    color:var(--gold-dim); font-size:11.5px; font-weight:700; border:1px dashed var(--gold-dim);
    padding:5px 10px; border-radius:8px;
  }

  .row{ display:flex; align-items:center; gap:14px; margin-bottom:10px; }
  .row .side{ display:flex; gap:8px; }
  .row .aisle{ flex:1; min-width:18px; max-width:34px; }
  .row.back{ justify-content:center; gap:8px; margin-top:6px; padding-top:12px; border-top:1px dashed var(--hairline); }

  .seat{
    --s: 46px;
    width:var(--s); height:var(--s);
    border-radius: 11px 11px 5px 5px;
    border:1.5px solid var(--panel-border);
    background: #101013;
    display:flex; align-items:center; justify-content:center;
    position:relative; color:var(--muted); font-size:12px; font-weight:700;
    transition: transform .12s ease, border-color .15s ease, background .15s ease;
  }
  .seat::before{
    content:""; position:absolute; top:5px; left:6px; right:6px; height:4px;
    border-radius:3px; background:#1c1c20;
  }
  .seat.empty:hover{ border-color: var(--gold-dim); transform: translateY(-2px); background:#141410; }
  .seat.booked{
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    border-color: var(--gold); color: var(--booked-text); font-size:9.5px; font-weight:800;
    line-height:1.15; padding:2px; text-align:center; overflow:hidden;
  }
  .seat.booked::before{ background: rgba(20,18,12,0.25); }
  .seat.booked:hover{ transform: translateY(-2px); filter:brightness(1.06); }
  .seat.faculty{
    background: var(--faculty-bg); border:1.5px dashed var(--faculty-border); color: var(--gold-dim);
    cursor:not-allowed; font-size:9px; font-weight:700;
  }
  .seat.faculty::before{ display:none; }

  .legend{
    display:flex; gap:18px; flex-wrap:wrap; margin-top:20px; padding: 0 4px;
  }
  .legend .item{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); }
  .legend .swatch{ width:16px; height:16px; border-radius:5px 5px 2px 2px; }
  .legend .swatch.empty{ border:1.5px solid var(--panel-border); background:#101013; }
  .legend .swatch.booked{ background: linear-gradient(180deg, var(--gold-bright), var(--gold)); }
  .legend .swatch.faculty{ background: var(--faculty-bg); border:1.5px dashed var(--faculty-border); }

  /* ---------- List view ---------- */
  .roster-section{ margin-top:26px; }
  .roster-head{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .export-btn{
    background: linear-gradient(180deg, var(--gold-bright), var(--gold)); border:none;
    color:#14120c; font-weight:800; padding:10px 16px; border-radius:10px; font-size:13px;
    display:flex; align-items:center; gap:7px; white-space:nowrap;
  }
  .export-btn:hover{ filter:brightness(1.05); }
  .roster-vehicle{
    font-family:'Fraunces', serif; font-size:20px; color:var(--gold-bright); margin: 30px 0 12px;
    padding-bottom:8px; border-bottom:1px solid var(--hairline);
  }
  .roster-vehicle:first-child{ margin-top:6px; }
  .roster-leg{ margin-bottom:18px; }
  .roster-leg h3{
    font-size:12.5px; color:var(--muted); font-weight:700; margin:0 0 8px; letter-spacing:.2px;
  }
  .roster-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1px; }
  .roster-list li{
    display:flex; align-items:center; gap:12px; padding:9px 12px; background:var(--panel-bg);
    border:1px solid var(--panel-border); font-size:13.5px;
  }
  .roster-list li:first-child{ border-radius:9px 9px 0 0; }
  .roster-list li:last-child{ border-radius:0 0 9px 9px; }
  .roster-list li + li{ border-top:none; }
  .roster-seatno{
    min-width:34px; height:26px; display:flex; align-items:center; justify-content:center;
    background:#1c1a12; color:var(--gold-bright); border-radius:6px; font-size:11.5px; font-weight:800;
  }
  .roster-name{ color:var(--text); font-weight:600; }
  .empty-note{ color:var(--muted-2); font-size:13px; font-style:italic; padding:10px 2px; }

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(4,4,5,0.7); backdrop-filter: blur(3px);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal{
    background:#131316; border:1px solid var(--panel-border); border-radius:16px;
    width:100%; max-width:340px; padding:22px 22px 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal .seatno-badge{
    display:inline-flex; align-items:center; gap:6px; background:#1c1a12; color:var(--gold-bright);
    padding:5px 11px; border-radius:999px; font-size:12px; font-weight:800; margin-bottom:14px;
  }
  .modal h2{ font-family:'Fraunces', serif; font-weight:500; font-size:19px; margin:0 0 4px; }
  .modal .sub{ color:var(--muted); font-size:13px; margin:0 0 16px; }
  .modal input{
    width:100%; background:#0c0c0e; border:1.5px solid var(--panel-border); color:var(--text);
    padding:11px 13px; border-radius:9px; font-size:14.5px; font-family:inherit;
  }
  .modal input:focus{ border-color: var(--gold-dim); }
  .modal .row-btns{ display:flex; gap:10px; margin-top:18px; }
  .modal button.primary{
    flex:1; background: linear-gradient(180deg, var(--gold-bright), var(--gold)); border:none;
    color:#14120c; font-weight:800; padding:11px; border-radius:9px; font-size:13.5px;
  }
  .modal button.secondary{
    flex:1; background:none; border:1.5px solid var(--panel-border); color:var(--muted);
    padding:11px; border-radius:9px; font-size:13.5px; font-weight:700;
  }
  .modal button.release{
    width:100%; background:none; border:1.5px solid var(--release); color:var(--release);
    padding:11px; border-radius:9px; font-size:13.5px; font-weight:700; margin-top:10px;
  }
  .modal .booked-by{
    background:#0c0c0e; border:1px solid var(--panel-border); border-radius:10px; padding:14px;
    font-size:15px; color:var(--text); font-weight:700; margin-bottom:4px;
  }

  .status-note{ font-size:11.5px; color:var(--muted-2); margin-top:16px; text-align:center; }

  @media (max-width:420px){
    .seat{ --s: 40px; }
    .row{ gap:10px; }
    .row .side{ gap:6px; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div class="topbar">
  <button class="tab-btn" id="navToggle"><span class="dot"></span><span id="navToggleLabel">List</span></button>
  <div class="course-tag">CSE (AI), S3</div>
</div>

<div class="wrap" id="app"></div>

<div id="modalRoot"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
import { getDatabase, ref, onValue, set as dbSet, remove as dbRemove } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBnMF6Febmyxx59uyrtFmzAuTBCw7EY168",
  authDomain: "cse-s3-busbooking.firebaseapp.com",
  databaseURL: "https://cse-s3-busbooking-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "cse-s3-busbooking",
  storageBucket: "cse-s3-busbooking.firebasestorage.app",
  messagingSenderId: "551670488178",
  appId: "1:551670488178:web:30f621b74ce0e937ff36eb"
};

const firebaseApp = initializeApp(firebaseConfig);
const db = getDatabase(firebaseApp);

// Change this to your own passcode — required to release someone else's seat.
const ADMIN_PASSCODE = "changeme";

(function(){

  // ---------------- Vehicle / seat configuration ----------------

  // Real Indian tourist bus: 2+3 configuration (2 seats door-side, 3 seats driver-side).
  function buildBusRows(){
    let n = 1;
    const rows = [];
    rows.push({ type:'facultyBus', right:[n++, n++, n++] });
    for(let i=0;i<8;i++){
      rows.push({ type:'bus', left:[n++, n++], right:[n++, n++, n++] });
    }
    return { rows, total: n - 1 };
  }

  // Real 17-seater Tempo Traveller: 2+1 configuration with a full-width bench at the back.
  function buildTravellerRows(){
    let n = 1;
    const rows = [];
    rows.push({ type:'facultyTrav' });
    for(let i=0;i<4;i++){
      rows.push({ type:'trav', left:[n++, n++], right:[n++] });
    }
    rows.push({ type:'back', seats:[n++, n++, n++] });
    return { rows, total: n - 1 };
  }

  const busData = buildBusRows();
  const travData = buildTravellerRows();

  const VEHICLES = {
    bus45: { key:'bus45', label:'45-Seater Bus', short:'Bus', rows: busData.rows, studentSeats: busData.total },
    traveller17: { key:'traveller17', label:'17-Seater Traveller', short:'Traveller', rows: travData.rows, studentSeats: travData.total }
  };

  const SECTIONS = [
    { key:'to-ernakulam', label:'College \u2192 Ernakulam' },
    { key:'in-ernakulam', label:'In Ernakulam' },
    { key:'ernakulam-to-dinner', label:'Ernakulam \u2192 Dinner' },
    { key:'dinner-to-college', label:'Dinner \u2192 College' }
  ];

  // ---------------- State ----------------

  const state = {
    view: 'book',          // 'book' | 'list'
    vehicle: 'bus45',
    section: 'to-ernakulam',
    bookings: {},           // { [seatNumber]: name }  for current vehicle+section
    loading: true
  };

  const app = document.getElementById('app');
  const modalRoot = document.getElementById('modalRoot');
  const navToggle = document.getElementById('navToggle');
  const navToggleLabel = document.getElementById('navToggleLabel');

  navToggle.addEventListener('click', () => {
    if(state.view === 'book'){
      state.view = 'list';
      if(currentUnsub){ currentUnsub(); currentUnsub = null; }
      render();
      subscribeList();
    } else {
      state.view = 'book';
      if(listUnsub){ listUnsub(); listUnsub = null; }
      subscribeCurrent();
    }
  });

  // ---------------- Realtime Firebase bindings ----------------

  function bookingsPath(vehicle, section){
    return `bookings/${vehicle}/${section}`;
  }

  let currentUnsub = null;
  function subscribeCurrent(){
    if(currentUnsub){ currentUnsub(); currentUnsub = null; }
    state.loading = true;
    render();
    const r = ref(db, bookingsPath(state.vehicle, state.section));
    currentUnsub = onValue(r, (snapshot) => {
      state.bookings = snapshot.val() || {};
      state.loading = false;
      if(state.view === 'book') render();
    });
  }

  let listCache = null;
  let listUnsub = null;
  function subscribeList(){
    if(listUnsub){ listUnsub(); listUnsub = null; }
    state.loading = true;
    render();
    const r = ref(db, 'bookings');
    listUnsub = onValue(r, (snapshot) => {
      listCache = snapshot.val() || {};
      state.loading = false;
      if(state.view === 'list') render();
    });
  }

  async function bookSeat(vehicle, section, seatNum, name){
    try{
      await dbSet(ref(db, `${bookingsPath(vehicle, section)}/${seatNum}`), name);
      return true;
    }catch(e){
      return false;
    }
  }

  async function releaseSeat(vehicle, section, seatNum){
    try{
      await dbRemove(ref(db, `${bookingsPath(vehicle, section)}/${seatNum}`));
      return true;
    }catch(e){
      return false;
    }
  }

  // ---------------- Rendering ----------------

  function render(){
    navToggleLabel.textContent = state.view === 'book' ? 'List' : 'Booking';
    if(state.view === 'book'){
      renderBookingView();
    } else {
      renderListView();
    }
  }

  function renderBookingView(){
    const vehicle = VEHICLES[state.vehicle];
    const sectionLabel = SECTIONS.find(s => s.key === state.section).label;

    app.innerHTML = `
      <div class="hero">
        <h1>Reserve your seat</h1>
        <p>Pick a leg of the trip, choose your vehicle, then tap an open seat to add your name. Front seats by the door are kept for faculty.</p>
      </div>

      <div class="seg-group">
        <div class="seg-label">Vehicle</div>
        <div class="seg" id="vehicleSeg">
          ${Object.values(VEHICLES).map(v => `
            <button data-vehicle="${v.key}" class="${v.key === state.vehicle ? 'active' : ''}">${v.label}</button>
          `).join('')}
        </div>
      </div>

      <div class="seg-group">
        <div class="seg-label">Leg of the trip</div>
        <div class="seg" id="sectionSeg">
          ${SECTIONS.map(s => `
            <button data-section="${s.key}" class="${s.key === state.section ? 'active' : ''}">${s.label}</button>
          `).join('')}
        </div>
      </div>

      <div class="coach-shell">
        <div class="coach-head">
          <span class="name">${vehicle.label} \u00b7 ${sectionLabel}</span>
          <span class="count">${state.loading ? '...' : bookedCount(vehicle) + ' / ' + vehicle.studentSeats + ' booked'}</span>
        </div>
        <div class="cabin">
          <div class="front-strip">
            <div class="door-badge">Door</div>
            <div class="driver-badge"><span class="steer"></span>Driver</div>
          </div>
          <div id="seatMap">${state.loading ? '' : buildSeatMapHTML(vehicle)}</div>
        </div>
      </div>

      <div class="legend">
        <div class="item"><span class="swatch empty"></span>Available</div>
        <div class="item"><span class="swatch booked"></span>Booked</div>
        <div class="item"><span class="swatch faculty"></span>Faculty only</div>
      </div>

      <p class="status-note">Seat selections are shared with everyone in CSE (AI), S3 using this link.</p>
    `;

    document.getElementById('vehicleSeg').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-vehicle]');
      if(!btn) return;
      state.vehicle = btn.dataset.vehicle;
      subscribeCurrent();
    });

    document.getElementById('sectionSeg').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-section]');
      if(!btn) return;
      state.section = btn.dataset.section;
      subscribeCurrent();
    });

    if(!state.loading){
      document.getElementById('seatMap').addEventListener('click', onSeatClick);
    }
  }

  function bookedCount(vehicle){
    return Object.keys(state.bookings).length;
  }

  function seatCell(num, extraClass){
    const name = state.bookings[String(num)];
    const isBooked = !!name;
    const cls = ['seat', isBooked ? 'booked' : 'empty', extraClass || ''].join(' ').trim();
    const label = isBooked ? escapeHtml(name) : num;
    return `<div class="${cls}" data-seat="${num}" tabindex="0" role="button" aria-label="Seat ${num}${isBooked ? ', booked by ' + name : ', available'}">${label}</div>`;
  }

  function facultyCell(label){
    return `<div class="seat faculty" aria-label="Reserved for faculty">${label}</div>`;
  }

  function buildSeatMapHTML(vehicle){
    let html = '';
    vehicle.rows.forEach(row => {
      if(row.type === 'facultyBus'){
        // 2 faculty seats (door side) + 3 student seats (driver side) — bus front row.
        html += `
          <div class="row">
            <div class="side">${facultyCell('Staff')}${facultyCell('Staff')}</div>
            <div class="aisle"></div>
            <div class="side">${row.right.map(s => seatCell(s)).join('')}</div>
          </div>`;
      } else if(row.type === 'facultyTrav'){
        // 2 faculty "captain seats" only — traveller front row, nothing opposite (entry side).
        html += `
          <div class="row">
            <div class="side">${facultyCell('Staff')}${facultyCell('Staff')}</div>
            <div class="aisle"></div>
            <div class="side" style="opacity:.35;font-size:10.5px;color:var(--muted-2);align-self:center;">entry</div>
          </div>`;
      } else if(row.type === 'bus'){
        // Door-side (2 seats) on the left, driver-side (3 seats) on the right.
        html += `
          <div class="row">
            <div class="side">${row.left.map(s => seatCell(s)).join('')}</div>
            <div class="aisle"></div>
            <div class="side">${row.right.map(s => seatCell(s)).join('')}</div>
          </div>`;
      } else if(row.type === 'trav'){
        // Door-side (2 seats) on the left, driver-side (1 seat) on the right.
        html += `
          <div class="row">
            <div class="side">${row.left.map(s => seatCell(s)).join('')}</div>
            <div class="aisle"></div>
            <div class="side">${row.right.map(s => seatCell(s)).join('')}</div>
          </div>`;
      } else if(row.type === 'back'){
        // Full-width bench seat at the rear, no aisle.
        html += `
          <div class="row back">
            ${row.seats.map(s => seatCell(s)).join('')}
          </div>`;
      }
    });
    return html;
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ---------------- Seat interactions ----------------

  function onSeatClick(e){
    const cell = e.target.closest('.seat');
    if(!cell || cell.classList.contains('faculty')) return;
    const seatNum = cell.dataset.seat;
    const existingName = state.bookings[seatNum];
    if(existingName){
      openViewModal(seatNum, existingName);
    } else {
      openBookModal(seatNum);
    }
  }

  function closeModal(){
    modalRoot.innerHTML = '';
  }

  function openBookModal(seatNum){
    modalRoot.innerHTML = `
      <div class="modal-backdrop" id="backdrop">
        <div class="modal">
          <div class="seatno-badge">Seat ${seatNum}</div>
          <h2>Book this seat</h2>
          <p class="sub">Enter your name to reserve it. It'll show up on the seat map right away.</p>
          <input type="text" id="nameInput" placeholder="Your full name" maxlength="40" autofocus />
          <div class="row-btns">
            <button class="secondary" id="cancelBtn">Cancel</button>
            <button class="primary" id="confirmBtn">Book seat</button>
          </div>
        </div>
      </div>`;
    const input = document.getElementById('nameInput');
    input.focus();
    document.getElementById('cancelBtn').addEventListener('click', closeModal);
    document.getElementById('backdrop').addEventListener('click', (e) => { if(e.target.id === 'backdrop') closeModal(); });
    const confirm = async () => {
      const name = input.value.trim();
      if(!name) { input.focus(); return; }
      closeModal();
      // The realtime listener updates the seat map for everyone, including this tab.
      await bookSeat(state.vehicle, state.section, seatNum, name);
    };
    document.getElementById('confirmBtn').addEventListener('click', confirm);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') confirm(); });
  }

  function openViewModal(seatNum, name){
    modalRoot.innerHTML = `
      <div class="modal-backdrop" id="backdrop">
        <div class="modal">
          <div class="seatno-badge">Seat ${seatNum}</div>
          <h2>Seat booked</h2>
          <p class="sub">This seat is currently reserved.</p>
          <div class="booked-by">${escapeHtml(name)}</div>
          <p class="sub" style="margin-top:14px;">Only an admin can release someone else's seat.</p>
          <input type="password" id="adminPass" placeholder="Admin passcode" />
          <div id="passError" style="color:var(--release);font-size:12px;margin-top:8px;display:none;">Incorrect passcode.</div>
          <button class="release" id="releaseBtn">Release this seat</button>
        </div>
      </div>`;
    document.getElementById('backdrop').addEventListener('click', (e) => { if(e.target.id === 'backdrop') closeModal(); });
    const passInput = document.getElementById('adminPass');
    const passError = document.getElementById('passError');
    document.getElementById('releaseBtn').addEventListener('click', async () => {
      if(passInput.value !== ADMIN_PASSCODE){
        passError.style.display = 'block';
        passInput.focus();
        return;
      }
      closeModal();
      await releaseSeat(state.vehicle, state.section, seatNum);
    });
    passInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') document.getElementById('releaseBtn').click(); });
  }

  // ---------------- List view ----------------

  function renderListView(){
    if(state.loading || !listCache){
      app.innerHTML = `
        <div class="hero"><h1>Roster</h1><p>Loading every seat booked so far across both vehicles.</p></div>
        <p class="status-note">Fetching bookings\u2026</p>`;
      return;
    }

    let html = `
      <div class="hero roster-head">
        <div>
          <h1>Roster</h1>
          <p>Everyone who has booked a seat so far, grouped by vehicle and leg of the trip.</p>
        </div>
        <button class="export-btn" id="exportBtn">Download as Excel</button>
      </div>`;

    Object.values(VEHICLES).forEach(vehicle => {
      html += `<div class="roster-vehicle">${vehicle.label}</div>`;
      SECTIONS.forEach(sec => {
        const bookings = (listCache[vehicle.key] && listCache[vehicle.key][sec.key]) || {};
        const seatNums = Object.keys(bookings).map(Number).sort((a,b) => a - b);
        html += `<div class="roster-leg"><h3>${sec.label}</h3>`;
        if(seatNums.length === 0){
          html += `<div class="empty-note">No seats booked yet for this leg.</div>`;
        } else {
          html += `<ul class="roster-list">`;
          seatNums.forEach(num => {
            html += `<li><span class="roster-seatno">${num}</span><span class="roster-name">${escapeHtml(bookings[String(num)])}</span></li>`;
          });
          html += `</ul>`;
        }
        html += `</div>`;
      });
    });

    app.innerHTML = html;
    document.getElementById('exportBtn').addEventListener('click', exportRosterToExcel);
  }

  function exportRosterToExcel(){
    if(!listCache || typeof XLSX === 'undefined') return;
    const rows = [['Vehicle', 'Leg', 'Seat', 'Name']];
    Object.values(VEHICLES).forEach(vehicle => {
      SECTIONS.forEach(sec => {
        const bookings = (listCache[vehicle.key] && listCache[vehicle.key][sec.key]) || {};
        const seatNums = Object.keys(bookings).map(Number).sort((a,b) => a - b);
        seatNums.forEach(num => {
          rows.push([vehicle.label, sec.label, num, bookings[String(num)]]);
        });
      });
    });
    const sheet = XLSX.utils.aoa_to_sheet(rows);
    sheet['!cols'] = [{ wch: 20 }, { wch: 22 }, { wch: 8 }, { wch: 28 }];
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, sheet, 'Seat Bookings');
    const today = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(workbook, `cse-ai-s3-seat-bookings-${today}.xlsx`);
  }

  // ---------------- Init ----------------

  subscribeCurrent();

})();
</script>
</body>
</html>
